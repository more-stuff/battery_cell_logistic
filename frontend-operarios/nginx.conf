server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # El HTML nunca se queda cacheado:
    # así siempre carga los nombres nuevos de los bundles de Vite.
    location = /index.html {
        try_files $uri =404;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Los JS/CSS compilados llevan hash en el nombre: sí pueden cachearse.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # React: las rutas como /administrative devuelven index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API hacia FastAPI
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        send_timeout 1800s;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}